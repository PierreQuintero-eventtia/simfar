name: Compilar APK SIMFAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar proyecto Android
        run: |
          rm -rf android
          flutter create .
          
          # Habilitar soporte para reconocimiento de voz (minSdkVersion 21)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true

          # Inyectar permisos de Microfono y Red en AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/application>/a \    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Descargar librerías
        run: flutter pub get

      - name: Compilar APK Android
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMFAR-APK-Chile
          path: build/app/outputs/flutter-apk/*.apk
