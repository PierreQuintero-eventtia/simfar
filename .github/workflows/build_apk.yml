name: Compilar APK SIMFAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: SIMFAR-APK-Chile
          path: build/app/outputs/flutter-apk/app-release.apk
