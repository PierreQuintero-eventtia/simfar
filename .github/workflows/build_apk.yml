name: Compilar APK SIMFAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter Estable (3.22.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Configurar Entorno Android Nativo
        run: |
          # Eliminar configuración anterior y regenerar con el nombre sincronizado
          rm -rf android
          flutter create --platforms=android --project-name=simfar .

          # Inyectar permisos de voz y consultas en AndroidManifest.xml
          python3 -c '
          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              text = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.BLUETOOTH"/>
          """
          queries = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
          """
          text = text.replace("<application", perms + "\n    <application")
          text = text.replace("</application>", "</application>\n" + queries)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(text)
          '

          # Desactivar bloqueos de R8 y Lint en build.gradle
          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              bg = f.read()

          bg = bg.replace("android {", "android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }")
          bg = bg.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
          bg = bg.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")

          with open("android/app/build.gradle", "w") as f:
              f.write(bg)
          '

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: |
          flutter build apk --release --no-shrink --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} || \
          flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Subir APK Terminado
        uses: actions/upload-artifact@v4
        with:
          name: SIMFAR-APK-Chile
          path: build/app/outputs/flutter-apk/*.apk
