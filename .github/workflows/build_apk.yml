name: Compilar APK SIMFAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter Estable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar proyecto Android base
        run: |
          rm -rf android
          flutter create .

      - name: Descargar dependencias
        run: flutter pub get

      - name: Parchear jcenter y configurar Android
        run: python3 configure_android.py

      - name: Compilar APK Android
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMFAR-APK-Chile
          path: build/app/outputs/flutter-apk/*.apk
